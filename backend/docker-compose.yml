name: sensor-predictive

x-backend-environment: &backend-environment
    DATABASE_URL: postgres://app:app@postgres:5432/sensor_predictive?sslmode=disable
    KAFKA_BROKERS: kafka:9092
    KAFKA_SENSOR_EVENTS_TOPIC: sensor.events.v1
    KAFKA_PREDICTIONS_TOPIC: predictions.v1
    KAFKA_SENSOR_EVENTS_DLQ_TOPIC: sensor.events.dlq.v1
    KAFKA_PREDICTIONS_DLQ_TOPIC: predictions.dlq.v1
    KAFKA_CONSUMER_GROUP: backend.predictions.v1
    KAFKA_TELEMETRY_CONSUMER_GROUP: backend.telemetry.v1
    JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-deploy}
    JWT_ISSUER: sensor-predictive-backend
    JWT_ACCESS_TTL: 1h
    BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
    BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-AdminPredict2026!}
    BOOTSTRAP_DISPATCHER_USERNAME: ${BOOTSTRAP_DISPATCHER_USERNAME:-dispatcher}
    BOOTSTRAP_DISPATCHER_PASSWORD: ${BOOTSTRAP_DISPATCHER_PASSWORD:-DispatchPredict2026!}
    BOOTSTRAP_ANALYST_USERNAME: ${BOOTSTRAP_ANALYST_USERNAME:-analyst}
    BOOTSTRAP_ANALYST_PASSWORD: ${BOOTSTRAP_ANALYST_PASSWORD:-AnalystPredict2026!}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
    MODEL_SERVICE_URL: ${MODEL_SERVICE_URL:-http://model-service:8000}
    MODEL_REQUEST_TIMEOUT: ${MODEL_REQUEST_TIMEOUT:-10s}

services:
    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: sensor_predictive
            POSTGRES_USER: app
            POSTGRES_PASSWORD: app
        ports:
            - "5433:5432"
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "test $$(cat /proc/1/comm) = postgres && pg_isready -U app -d sensor_predictive",
                ]
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    kafka:
        image: apache/kafka:3.9.1
        ports:
            - "29092:29092"
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:9092,PLAINTEXT_HOST://:29092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            KAFKA_NUM_PARTITIONS: 3
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1",
                ]
            interval: 5s
            timeout: 5s
            retries: 30

    kafka-init:
        image: apache/kafka:3.9.1
        depends_on:
            kafka:
                condition: service_healthy
        entrypoint: ["/bin/sh", "-ec"]
        command:
            - |
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor.events.v1 --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic predictions.v1 --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic sensor.events.dlq.v1 --partitions 3 --replication-factor 1
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic predictions.dlq.v1 --partitions 3 --replication-factor 1

    migrate:
        image: migrate/migrate:v4.18.3
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - ./migrations:/migrations:ro
        command:
            [
                "-path",
                "/migrations",
                "-database",
                "postgres://app:app@postgres:5432/sensor_predictive?sslmode=disable",
                "up",
            ]
        restart: "no"

    api:
        build:
            context: .
        environment:
            <<: *backend-environment
            HTTP_ADDR: :8080
        ports:
            - "8083:8080"
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            bootstrap-importer:
                condition: service_completed_successfully
        healthcheck:
            test: ["CMD", "wget", "-qO-", "http://localhost:8080/health/live"]
            interval: 5s
            timeout: 3s
            retries: 20

    worker:
        build:
            context: .
        entrypoint: ["/app/worker"]
        environment:
            <<: *backend-environment
        depends_on:
            postgres:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully

    model-service:
        build:
            context: ../model
            dockerfile: service/Dockerfile
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            KAFKA_INPUT_TOPIC: sensor.events.v1
            KAFKA_OUTPUT_TOPIC: predictions.v1
            KAFKA_DLQ_TOPIC: sensor.events.dlq.v1
            KAFKA_CONSUMER_GROUP: model-service.v1
            DATABASE_URL: postgresql://app:app@postgres:5432/sensor_predictive
            MODEL_ROOT: /model
            PREDICTION_INTERVAL: ${PREDICTION_INTERVAL:-60}
        volumes:
            - ../model/models:/model/models:ro
        ports:
            - "8000:8000"
        depends_on:
            postgres:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
            bootstrap-importer:
                condition: service_completed_successfully
        healthcheck:
            test:
                [
                    "CMD",
                    "python",
                    "-c",
                    "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
                ]
            interval: 10s
            timeout: 5s
            retries: 20
        profiles: ["model"]

    simulator:
        build:
            context: .
        entrypoint:
            ["/app/simulator", "-interval", "5s", "-registry-refresh", "1m"]
        environment:
            <<: *backend-environment
        depends_on:
            kafka-init:
                condition: service_completed_successfully
            bootstrap-importer:
                condition: service_completed_successfully
        profiles: ["demo"]

    bootstrap-importer:
        build:
            context: .
        entrypoint: ["/app/importer"]
        command:
            - "--objects"
            - "/data/objects.csv"
            - "--channels"
            - "/data/channels.csv"
        environment:
            <<: *backend-environment
        volumes:
            - ./testdata:/data:ro
        depends_on:
            postgres:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
        restart: "no"

    importer:
        build:
            context: .
        entrypoint: ["/app/importer"]
        environment:
            <<: *backend-environment
        depends_on:
            postgres:
                condition: service_healthy
            kafka-init:
                condition: service_completed_successfully
            migrate:
                condition: service_completed_successfully
        profiles: ["tools"]

    swagger-ui:
        image: swaggerapi/swagger-ui:v5.31.0
        environment:
            SWAGGER_JSON: /spec/openapi.yaml
        volumes:
            - ./api/openapi.yaml:/spec/openapi.yaml:ro
        ports:
            - "8081:8080"

    frontend:
        build:
            context: ../frontend
        ports:
            - "3000:80"
        depends_on:
            api:
                condition: service_healthy

volumes:
    postgres-data:
